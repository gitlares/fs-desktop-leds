name: Validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  swift:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: swift test
      - name: Release build
        run: swift build -c release
      - name: Website checks
        run: python3 scripts/check-site.py
